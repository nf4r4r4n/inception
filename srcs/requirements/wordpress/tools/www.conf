; Custom configuration for PHP-FPM to listen on TCP port
; Instead of the default socket, we'll use TCP to communicate with Nginx container

[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
pm.max_requests = 500

; Security settings
php_admin_value[allow_url_fopen] = Off
php_admin_value[expose_php] = Off
php_admin_value[display_errors] = Off
php_admin_value[error_log] = /var/log/php-fpm-error.log