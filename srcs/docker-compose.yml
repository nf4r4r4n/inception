# ----------
#  SERVICES
# ----------
services:
  # ---------
  #  NGINX
  # ---------
  nginx:
    image: nginx:inception_nfararan
    container_name: nginx
    build:
      context: ./requirements/nginx
    restart: always
    depends_on:
      - wordpress
    volumes:
      - wp_data:/var/www/html
    ports:
      - "443:443"
    networks:
      - inception_network

  # -----------
  #  WORDPRESS
  # -----------
  wordpress:
    image: wordpress:inception_nfararan
    container_name: wordpress
    build:
      context: ./requirements/wordpress
    restart: always
    depends_on:
      - mariadb
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_pass
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER_MANAGER: ${DB_USER_MANAGER}
      WORDPRESS_DB_MANAGER_PASSWORD_FILE: /run/secrets/db_root_pass
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception_network
    secrets:
      - db_pass
      - db_root_pass

  # ---------
  #  MARIADB
  # ---------
  mariadb:
    image: mariadb:inception_nfararan
    container_name: mariadb
    build:
      context: ./requirements/mariadb
    restart: always
    environment:
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      DB_USER_MANAGER: ${DB_USER_MANAGER}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception_network
    secrets:
      - db_pass
      - db_root_pass

# ----------
#  NETWORKS
# ----------
networks:
  inception_network:
    driver: bridge

# ---------
#  SECRETS
# ---------
secrets:
  db_pass:
    file: ../secrets/db_pass.txt
  db_root_pass:
    file: ../secrets/db_root_pass.txt

# ---------
#  VOLUMES
# ---------
volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      device: /home/nfararan/data/db_data
      o: bind
  wp_data:
    driver: local
    driver_opts:
      type: none
      device: /home/nfararan/data/wp_data
      o: bind
